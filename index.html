<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Commonplace">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ECEEE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141816" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Commonplace</title>
<style>
:root{
  --bg:#ECEEE9; --bg-glass:rgba(236,238,233,.88); --surface:#FFFFFF; --surface-2:#F4F5F1;
  --ink:#1C221F; --muted:#5B6560; --faint:#879089; --rule:#D3D8D0; --rule-soft:#E5E9E2;
  --accent:#2B4A7E; --accent-ink:#FFFFFF; --accent-soft:#E2E8F2;
  --danger:#A3352B; --danger-ink:#FFFFFF; --paper:#FFFFFF; --focus:#2B4A7E;
  --serif:"New York", ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --sans:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --shadow-card:0 1px 2px rgba(28,34,31,.06), 0 10px 22px -16px rgba(28,34,31,.4);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --bg-glass:rgba(20,24,22,.88); --surface:#1D2320; --surface-2:#252C28;
    --ink:#E6EAE6; --muted:#A3ACA7; --faint:#7A837E; --rule:#333B37; --rule-soft:#2A312D;
    --accent:#97B4E4; --accent-ink:#0F1A2C; --accent-soft:#26334A;
    --danger:#E8907F; --danger-ink:#2A0F0B; --paper:#EEF0EB; --focus:#97B4E4;
    --shadow-card:0 1px 2px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141816; --bg-glass:rgba(20,24,22,.88); --surface:#1D2320; --surface-2:#252C28;
  --ink:#E6EAE6; --muted:#A3ACA7; --faint:#7A837E; --rule:#333B37; --rule-soft:#2A312D;
  --accent:#97B4E4; --accent-ink:#0F1A2C; --accent-soft:#26334A;
  --danger:#E8907F; --danger-ink:#2A0F0B; --paper:#EEF0EB; --focus:#97B4E4;
  --shadow-card:0 1px 2px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:16px/1.5 var(--sans)}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg-glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit; font-size:16px; color:var(--ink)}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* Layout */
.page{max-width:1180px; margin:0 auto; padding:0 max(20px, env(safe-area-inset-right,0px)) 72px max(20px, env(safe-area-inset-left,0px))}
@media (min-width:768px){.page{padding-left:max(36px, env(safe-area-inset-left,0px)); padding-right:max(36px, env(safe-area-inset-right,0px))}}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:8px; border:1px solid var(--rule); background:var(--surface); font-weight:600; font-size:15px; white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn-danger{background:var(--danger); border-color:var(--danger); color:var(--danger-ink)}
.btn-quiet{border-color:transparent; background:transparent; color:var(--muted)}
.btn[disabled]{opacity:.45; pointer-events:none}
.icon-btn{width:44px; height:44px; display:inline-grid; place-items:center; border-radius:8px; color:var(--muted); flex:none}
@media (hover:hover){.icon-btn:hover,.tool:hover{background:var(--surface-2)}}

/* Home */
.home-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:40px 0 22px}
.wordmark{font-family:var(--serif); font-weight:400; font-size:clamp(36px,5vw,48px); letter-spacing:-.012em; margin:0; line-height:1.05}
.wordmark-sub{margin:8px 0 0; color:var(--muted); font-size:15px}
.home-actions{display:flex; gap:8px; align-items:center}
.search-wrap{position:relative}
.search-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--faint); pointer-events:none}
.search{width:100%; height:52px; border-radius:10px; border:1px solid var(--rule); background:var(--surface); padding:0 16px 0 46px; -webkit-appearance:none; appearance:none; outline-offset:0}
.section{margin-top:40px}
.section-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; padding-bottom:10px; border-bottom:1px solid var(--rule)}
.section-title{font-family:var(--serif); font-size:21px; font-weight:500; margin:0}
.section-note{color:var(--muted); font-size:15px; margin:0}

/* Category tiles: card-box dividers with a colored tab */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:30px 18px; padding-top:12px}
.tile{position:relative}
.tile-main{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:2px; width:100%; min-height:132px; padding:18px 50px 16px 18px; text-align:left; background:var(--surface); border:1px solid var(--rule); border-radius:0 10px 10px 10px; box-shadow:var(--shadow-card)}
.tile-tab{position:absolute; left:-1px; top:-12px; height:12px; width:46%; background:var(--cat); border-radius:7px 7px 0 0}
.tile-name{font-family:var(--serif); font-size:21px; line-height:1.2; overflow-wrap:anywhere}
.tile-count{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.tile-desc{font-size:14px; color:var(--faint); margin-top:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.tile-edit{position:absolute; top:4px; right:4px}
.tile-new{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; width:100%; min-height:132px; border:1.5px dashed var(--rule); border-radius:10px; color:var(--muted); font-weight:600; font-size:15px}

/* Idea cards: index cards with a colored header rule */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px}
.card{position:relative; background:var(--surface); border:1px solid var(--rule); border-radius:3px; box-shadow:var(--shadow-card)}
.card-open{display:flex; flex-direction:column; width:100%; height:100%; min-height:210px; padding:16px 18px 14px; text-align:left}
.card-cat{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); margin-bottom:4px; padding-right:34px}
.card-cat::before{content:""; width:8px; height:8px; border-radius:2px; background:var(--cat); flex:none}
.card-title{font-family:var(--serif); font-size:19px; line-height:1.25; font-weight:500; margin:0; padding-right:34px; overflow-wrap:anywhere}
.card-rule{display:block; height:2px; background:var(--cat); margin:12px -18px 10px; opacity:.85}
.card-preview{font-family:var(--serif); font-size:15px; line-height:1.55; color:var(--muted); margin:0; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line; overflow-wrap:anywhere}
.card-blank{font-size:14px; color:var(--faint); margin:0}
.ink-thumb{display:block; width:100%; height:auto; border-radius:2px; background:var(--paper)}
.card-foot{margin-top:auto; padding-top:12px; display:flex; flex-direction:column; gap:2px}
.card-source{font-family:var(--serif); font-style:italic; font-size:14px; color:var(--muted); margin:0; overflow-wrap:anywhere}
.card-date{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--faint); margin:0}
.card-more{position:absolute; top:4px; right:4px}

/* Top bar */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg-glass); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--rule)}
.topbar-row{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:8px; min-height:58px; padding:0 max(12px, env(safe-area-inset-right,0px)) 0 max(12px, env(safe-area-inset-left,0px))}
.tools-row{border-top:1px solid var(--rule-soft); min-height:54px; overflow-x:auto; scrollbar-width:none; gap:2px}
.tools-row::-webkit-scrollbar{display:none}
.back{display:inline-flex; align-items:center; min-height:44px; padding:0 10px 0 2px; border-radius:8px; color:var(--accent); font-weight:600; max-width:34vw; flex:none}
.back span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.spacer{flex:1 1 auto}

/* Category page */
.cat-head{padding:30px 0 4px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px}
.cat-title{font-family:var(--serif); font-weight:400; font-size:clamp(30px,4.4vw,42px); line-height:1.1; margin:0; display:flex; align-items:center; gap:14px; overflow-wrap:anywhere}
.cat-swatch{width:12px; height:36px; border-radius:3px; background:var(--cat); flex:none}
.cat-desc{color:var(--muted); max-width:62ch; margin:10px 0 0}
.filters{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:24px 0 22px}
.filters .search-wrap{flex:1 1 260px}
.select{height:52px; border-radius:10px; border:1px solid var(--rule); background:var(--surface); padding:0 12px}
.empty{padding:40px 24px; text-align:center; color:var(--muted); border:1.5px dashed var(--rule); border-radius:10px}
.empty p{margin:0 0 14px}

/* Editor */
.editor{max-width:880px; margin:22px auto 96px; padding:0 max(14px, env(safe-area-inset-right,0px)) 0 max(14px, env(safe-area-inset-left,0px))}
.sheet{background:var(--surface); border:1px solid var(--rule); border-radius:6px; box-shadow:var(--shadow-card)}
.sheet-head{padding:26px 32px 0}
.title-input{display:block; width:100%; border:0; background:transparent; font-family:var(--serif); font-size:clamp(26px,3.6vw,34px); line-height:1.2; padding:4px 0; outline:none}
.title-input::placeholder{color:var(--faint)}
.sheet-rule{height:2px; background:var(--cat); margin:14px -32px 0}
.meta summary{list-style:none; display:flex; align-items:center; gap:10px; min-height:50px; cursor:pointer; color:var(--muted); font-size:14.5px}
.meta summary::-webkit-details-marker{display:none}
.meta summary .chev{transition:transform .15s}
.meta[open] summary .chev{transform:rotate(90deg)}
.meta-sum{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--serif); font-style:italic}
.meta-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 16px; padding:2px 0 14px}
.meta-grid .wide{grid-column:1 / -1}
.rich-wrap{border-top:1px solid var(--rule-soft)}
.rich{min-height:192px; padding:8px 32px 28px; font-family:var(--serif); font-size:19px; line-height:32px; outline:none; overflow-wrap:anywhere;
  background-image:linear-gradient(to bottom, transparent 31px, var(--rule-soft) 31px, var(--rule-soft) 32px); background-size:100% 32px; background-position:0 8px}
.rich.is-empty::before{content:attr(data-placeholder); color:var(--faint); float:left; height:0; pointer-events:none}
.rich p,.rich ul,.rich ol,.rich blockquote,.rich h2,.rich h3,.rich div{margin:0}
.rich h2{font-size:24px; line-height:32px; font-weight:600}
.rich h3{font-size:20px; line-height:32px; font-weight:600}
.rich ul,.rich ol{padding-left:28px}
.rich blockquote{border-left:3px solid var(--cat); padding-left:14px; font-style:italic; color:var(--muted)}
.is-drawing .rich{cursor:text}
.ink-section{border-top:1px solid var(--rule); padding:16px 32px 26px}
.ink-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap}
.ink-head h2{font-family:var(--serif); font-weight:500; font-size:17px; margin:0}
.ink-hint{font-size:13.5px; color:var(--muted)}
.ink-wrap{position:relative; width:100%; border-radius:4px; background:var(--paper); box-shadow:inset 0 0 0 1px var(--rule-soft)}
.is-drawing .ink-wrap{box-shadow:inset 0 0 0 2px var(--accent)}
.ink-canvas{display:block; touch-action:pan-y pinch-zoom; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.ink-canvas.finger{touch-action:none}
.add-space{margin-top:12px}
@media (max-width:640px){
  .sheet-head,.ink-section{padding-left:18px; padding-right:18px}
  .rich{padding-left:18px; padding-right:18px}
  .sheet-rule{margin-left:-18px; margin-right:-18px}
  .meta-grid{grid-template-columns:1fr}
}

/* Tools */
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--rule); border-radius:10px; padding:3px; flex:none}
.seg-btn{min-height:38px; padding:0 14px; border-radius:7px; font-weight:600; font-size:15px; color:var(--muted)}
.seg-btn[aria-checked="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.14)}
.tool{min-width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:8px; padding:0 10px; color:var(--ink); flex:none; font-size:15px}
.tool[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent)}
.tool[disabled]{opacity:.35; pointer-events:none}
.tool .lbl{font-weight:600}
.t-b{font-weight:800; font-family:var(--serif)} .t-i{font-style:italic; font-family:var(--serif)} .t-u{text-decoration:underline; font-family:var(--serif)}
.swatch{width:44px; height:44px; display:inline-grid; place-items:center; border-radius:50%; flex:none}
.swatch span{width:24px; height:24px; border-radius:50%; background:var(--c); box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.swatch[aria-pressed="true"] span{box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--c)}
.wdot{display:block; border-radius:50%; background:currentColor}
.divider{width:1px; height:26px; background:var(--rule); margin:0 6px; flex:none}
.status{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--muted); white-space:nowrap}
.status.error{color:var(--danger); font-weight:600}

/* Forms & modal */
.backdrop{position:fixed; inset:0; z-index:50; background:rgba(16,20,18,.45); display:grid; place-items:center; padding:max(16px, env(safe-area-inset-top,0px)) 16px max(16px, env(safe-area-inset-bottom,0px))}
.modal{width:min(520px,100%); max-height:100%; overflow:auto; background:var(--surface); border-radius:12px; padding:24px; box-shadow:0 24px 60px -24px rgba(0,0,0,.5)}
.modal-title{font-family:var(--serif); font-weight:500; font-size:23px; line-height:1.25; margin:0 0 6px; overflow-wrap:anywhere}
.modal-text{color:var(--muted); margin:0 0 16px}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px}
.label{font-size:14px; font-weight:600; color:var(--muted)}
.input{height:46px; width:100%; border:1px solid var(--rule); border-radius:8px; background:var(--surface); padding:0 12px; -webkit-appearance:none; appearance:none}
select.input{-webkit-appearance:auto; appearance:auto}
textarea.input{height:auto; min-height:84px; padding:10px 12px; resize:vertical}
.field-error{color:var(--danger); font-size:14px; margin:0}
.swatches{display:flex; flex-wrap:wrap; gap:2px}
.modal-actions{display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; margin-top:22px}
.modal-actions .left{margin-right:auto}
.choice{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--rule); border-radius:10px; margin-bottom:10px; cursor:pointer}
.choice:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.choice input[type=radio], .check input{width:22px; height:22px; margin:1px 0 0; flex:none; accent-color:var(--accent)}
.choice-body{display:flex; flex-direction:column; gap:8px; flex:1; min-width:0}
.check{display:flex; gap:10px; align-items:flex-start; font-size:15px}
.pick-list{display:grid; gap:8px}
.pick{display:flex; align-items:center; gap:12px; width:100%; min-height:52px; padding:0 14px; border:1px solid var(--rule); border-radius:10px; text-align:left; font-family:var(--serif); font-size:18px}
.pick::before{content:""; width:10px; height:26px; border-radius:2px; background:var(--cat); flex:none}
.tags{display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-height:46px; border:1px solid var(--rule); border-radius:8px; padding:6px 8px; background:var(--surface)}
.tag{display:inline-flex; align-items:center; background:var(--surface-2); border:1px solid var(--rule); border-radius:6px; padding:0 0 0 8px; font-size:14px}
.tag button{width:30px; height:30px; display:inline-grid; place-items:center; color:var(--muted)}
.tags input{border:0; flex:1; min-width:120px; height:32px; background:transparent; outline:none}

/* Settings */
.settings h1{font-family:var(--serif); font-weight:400; font-size:clamp(30px,4.4vw,40px); margin:30px 0 4px}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:20px 22px; margin-top:20px; max-width:760px}
.panel h2{font-family:var(--serif); font-weight:500; font-size:20px; margin:0 0 8px}
.panel p{margin:0 0 12px; color:var(--muted)}
.kv{display:grid; grid-template-columns:max-content 1fr; gap:6px 18px; margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0; font-variant-numeric:tabular-nums}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:60; max-width:min(560px,calc(100vw - 32px)); background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:10px; font-size:15px; box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.fatal{max-width:640px; margin:15vh auto; padding:0 24px}
.fatal h1{font-family:var(--serif); font-weight:400}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script type="module">
'use strict';
/* =====================================================================
   Commonplace, Stage 1 (single-file preview build)
   Sections mirror the planned React project layout:
   config, types, utils, sanitize, db, seed, handwriting, save, ui, screens, app
   ===================================================================== */

/* ---------- config ---------- */
const APP_VERSION = '0.2.0 (Stage 1, offline app)';
const DB_NAME = 'commonplace';
const DB_VERSION = 1;              // IndexedDB schema version
const NOTE_SCHEMA = 1;             // note record version
const INK_FORMAT = 'commonplace-ink';
const INK_VERSION = 1;
const PAGE_WIDTH = 1000;           // handwriting logical units; strokes never depend on screen size
const DEFAULT_PAGE_HEIGHT = 1300;
const PAGE_GROW = 650;
const MAX_PAGE_HEIGHT = 20000;
const RULE_GAP = 44;
const UNSORTED = 'Unsorted';

const CATEGORY_COLORS = ['#4A6FA5','#6E8B6A','#C1913A','#B0533C','#7D5A8C','#3E8A8A','#5B6168','#B86B7E'];
const INK_COLORS = [['Black','#1C221F'],['Blue','#2B4A7E'],['Red','#B23A2E'],['Green','#2F6B4F'],['Amber','#B7791F']];
const INK_WIDTHS = [['Fine',2],['Medium',3.5],['Bold',6]];

/* ---------- types (JSDoc; become TS interfaces in Path B) ----------
 * @typedef {{id:string,name:string,color:string,description:string,createdAt:string,updatedAt:string}} Category
 * @typedef {[number,number,number]} InkPoint   x, y in logical units, pressure 0..1
 * @typedef {{id:string,tool:'pen',color:string,width:number,input:'pen'|'mouse'|'touch',points:InkPoint[]}} InkStroke
 * @typedef {{format:'commonplace-ink',version:number,pageWidth:number,pageHeight:number,strokes:InkStroke[]}} InkDoc
 * @typedef {{id:string,schema:number,kind:'idea',categoryId:string,title:string,richTextContent:string,
 *   contentText:string,handwritingStrokes:InkDoc,sourceBook:string,author:string,pageNumber:string,
 *   tags:string[],links:string[],createdAt:string,updatedAt:string}} Note
 * contentText is derived from richTextContent (for search and previews).
 * kind and links are reserved so new note types and cross-links can be added without a rewrite.
 * All timestamps are ISO 8601 UTC strings.
 */

/* ---------- utils ---------- */
const uid = () => {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const x = [...b].map(v => v.toString(16).padStart(2, '0')).join('');
  return `${x.slice(0,8)}-${x.slice(8,12)}-${x.slice(12,16)}-${x.slice(16,20)}-${x.slice(20)}`;
};
const nowISO = () => new Date().toISOString();

/* ---------- save manager: ordered writes, never reports success early ---------- */
class NoteSaver {
  constructor(note, collect, onStatus) {
    Object.assign(this, { note, collect, onStatus });
    this.rev = 0; this.savedRev = 0; this.queuedRev = 0; this.timer = null;
    this.chain = Promise.resolve(); this.failed = false; this.disabled = false; this.lastError = null;
  }
  get dirty() { return this.rev > this.savedRev || this.failed; }
  touch(delay = 700) {
    if (this.disabled) return;
    this.rev++; this.onStatus('pending');
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), delay);
  }
  async flush() {
    clearTimeout(this.timer); this.timer = null;
    if (this.disabled) return true;
    if (!this.dirty) { await this.chain; return !this.failed; }
    const rev = this.rev;
    this.collect(this.note); this.note.updatedAt = nowISO();
    const snap = clone(this.note);
    this.queuedRev = rev;
    this.chain = this.chain.then(async () => {
      if (this.disabled || rev < this.queuedRev) return; // a newer snapshot is queued; skip this older one
      this.onStatus('saving');
      try {
        await db.putNote(snap);
        if (rev > this.savedRev) this.savedRev = rev;
        this.failed = false; this.lastError = null;
        state.notes.set(snap.id, snap);
        this.onStatus(this.rev > this.savedRev ? 'pending' : 'saved');
      } catch (err) {
        this.failed = true; this.lastError = err; this.onStatus('error', err);
      }
    });
    await this.chain;
    return !this.failed && this.savedRev >= rev;
  }
}

/* ---------- app state (cache of IndexedDB; IndexedDB stays the source of truth) ---------- */
const state = { categories: new Map(), notes: new Map() };
const ui = { homeQuery: '', catSort: 'updated', focusTitle: null, current: null };

async function loadAll() {
  const { categories, notes } = await db.getAll();
  state.categories = new Map(categories.map(c => [c.id, c]));
  const list = notes.map(normalizeNote);
  // Safety net: a card whose category is missing is moved to "Unsorted", never hidden.
  const orphans = list.filter(n => !state.categories.has(n.categoryId));
  if (orphans.length) {
    const target = unsortedCategory();
    if (!state.categories.has(target.id)) await db.putCategory(target);
    state.categories.set(target.id, target);
    orphans.forEach(n => { n.categoryId = target.id; });
    await db.putNotes(orphans);
  }
  state.notes = new Map(list.map(n => [n.id, n]));
}
const categoriesSorted = () => [...state.categories.values()].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
const notesIn = (cid) => [...state.notes.values()].filter(n => n.categoryId === cid);
const unsortedCategory = () => [...state.categories.values()].find(c => c.name.toLowerCase() === UNSORTED.toLowerCase()) || newCategory(UNSORTED, '#5B6168', 'Cards moved here when their category was deleted.');

function searchNotes(q, pool) {
  const terms = norm(q).split(/\s+/).filter(Boolean); if (!terms.length) return [];
  const phrase = norm(q).trim();
  return pool.map(n => {
    const title = norm(n.title);
    const hay = [title, norm(n.contentText), norm(n.sourceBook), norm(n.author), norm(n.tags.join(' '))].join('\n');
    if (!terms.every(t => hay.includes(t))) return null;
    const score = (hay.includes(phrase) ? 4 : 0) + terms.filter(t => title.includes(t)).length * 2;
    return { n, score };
  }).filter(Boolean).sort((a, b) => b.score - a.score || b.n.updatedAt.localeCompare(a.n.updatedAt)).map(x => x.n);
}

async function createNote(categoryId) {
  const n = newNote(categoryId);
  try { await db.putNote(n); } catch (err) { toast(`Couldn’t create the card. ${friendlyError(err)}`); return; }
  state.notes.set(n.id, n); ui.focusTitle = n.id; navigate(`#/n/${n.id}`);
}

      !unsortedIsSelf && h('label', { class: 'choice' }, radio('unsorted'), h('span', { class: 'choice-body', text: state.categories.has(unsorted.id) ? `Move them to “${UNSORTED}”` : `Move them to a new “${UNSORTED}” category` })),

      const ok = await cur.leave();
      if (!ok) {
        const leave = await confirmModal({ title: 'Your latest change was not saved', message: 'Stay on the card to try saving again, or leave and lose that change.', confirmText: 'Leave anyway', cancelText: 'Stay on card', danger: true });
        if (!leave) { suppress = true; location.hash = lastHash; return; }
      }
    }
    lastHash = location.hash; render();
  } finally { routing = false; }
}

/* ---------- boot ---------- */
async function boot() {
  try {
    await db.open();
    await db.seedIfNeeded(buildSampleLibrary);
    await loadAll();
  } catch (err) {
    document.getElementById('app').replaceChildren(h('main', { class: 'fatal' },
      h('h1', { text: 'Commonplace can’t open its storage' }),
      h('p', { text: friendlyError(err) }),
      h('p', { text: 'Private browsing or blocked website data in Safari settings can cause this. Nothing has been changed.' })));
    return;
  }
  window.addEventListener('hashchange', onRoute);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && ui.current && ui.current.flush) ui.current.flush(); });
  window.addEventListener('pagehide', () => { if (ui.current && ui.current.flush) ui.current.flush(); });
  render();
}
window.__commonplace = { state, ui, db, inkToSVG, sanitizeHTML }; // inspection hook for testing
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('Offline caching unavailable:', err)));
}
boot();
</script>
</body>
